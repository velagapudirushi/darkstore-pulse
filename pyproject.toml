[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkstore-pulse"
version = "0.1.0"
description = "Reverse-engineering quick-commerce dark stores: stockout prediction, restock truck forensics, and weather-surge analytics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rushi Velagapudi", email = "velagapudirushi@users.noreply.github.com" }
]
dependencies = [
    "duckdb>=1.1.0",
    "lightgbm>=4.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pandera>=0.20.0",
    "playwright>=1.45.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "shap>=0.45.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
